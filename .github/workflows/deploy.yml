name: Deploy player

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'patches/**'
      - 'gamepad-boost.js'
      - 'tests/test_player_gamepad.cjs'
      - 'tests/test_player_touch.cjs'
      - 'save-slots.js'
      - 'save-slots-ui.js'
      - 'tests/test_player_slots.cjs'
      - 'tests/test_player_saves.cjs'
      - 'tests/test_player_speed.cjs'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test cartridge save persistence
        run: node tests/test_player_saves.cjs
      - name: Test Space speed controls
        run: node tests/test_player_speed.cjs
      - name: Test save-state slots
        run: node tests/test_player_slots.cjs
      - name: Test controller boost assignment
        run: node tests/test_player_gamepad.cjs
      - name: Test mobile touch controls
        run: node tests/test_player_touch.cjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload player
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
