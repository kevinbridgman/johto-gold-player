name: Build and publish Johto IPS patch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build-tools/**'
      - 'release.json'
      - 'tests/**'
      - '.github/workflows/publish-patch.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-patch
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test release preservation
        run: python3 -m unittest discover -s tests -v
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libpng-dev pkg-config git curl
      - name: Install RGBDS 1.0.4
        run: |
          git clone --depth 1 --branch v1.0.4 https://github.com/gbdev/rgbds.git /tmp/rgbds
          make -C /tmp/rgbds -j"$(nproc)"
          sudo make -C /tmp/rgbds install
      - name: Fetch Pokémon Gold disassembly
        run: git clone --depth 1 https://github.com/pret/pokegold.git /tmp/pokegold
      - name: Build baseline and record fingerprint
        run: |
          make -C /tmp/pokegold gold -j"$(nproc)"
          cp /tmp/pokegold/pokegold.gbc /tmp/johto-original.gbc
      - name: Apply source changes
        run: |
          python3 build-tools/patch_six_starters.py /tmp/pokegold
          python3 build-tools/patch_exp_modifier.py /tmp/pokegold
          python3 build-tools/patch_new_bark_cave.py /tmp/pokegold
      - name: Build modified ROM and generate IPS
        run: |
          make -C /tmp/pokegold gold -j"$(nproc)"
          python3 build-tools/make_ips.py /tmp/johto-original.gbc /tmp/pokegold/pokegold.gbc /tmp/johto-release.ips
          test -s /tmp/johto-release.ips
      - name: Validate compiled experience option and awards
        run: |
          python3 -m venv /tmp/exp-validation
          /tmp/exp-validation/bin/pip install pyboy==2.9.0
          /tmp/exp-validation/bin/python build-tools/validate_exp_modifier.py /tmp/pokegold/pokegold.gbc
      - name: Validate compiled cave layout and warps
        run: python3 build-tools/validate_new_bark_cave.py /tmp/pokegold/pokegold.gbc
      - name: Register immutable release (no ROM)
        run: python3 build-tools/publish_release.py --baseline /tmp/johto-original.gbc --patch /tmp/johto-release.ips
      - name: Publish IPS and catalog to public repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches/catalog.json patches/*-v*.ips
          if git diff --cached --quiet; then
            echo "Patch already up-to-date"
          else
            git commit -m "Publish new versioned Johto modification patch"
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" = 4 ]; then
                echo "Could not publish IPS after retries" >&2
                exit 1
              fi
            done
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site and new patch
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy player and published patch
        id: deployment
        uses: actions/deploy-pages@v4

